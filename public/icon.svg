<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle grid lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.25"/>

  <!-- Outer Shield Contour -->
  <path d="M256 84 C340 84 400 112 400 180 C400 290 320 380 256 424 C192 380 112 290 112 180 C112 112 172 84 256 84 Z" 
        fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Shield Fill -->
  <path d="M256 104 C324 104 376 128 376 186 C376 276 308 354 256 394 C204 354 136 276 136 186 C136 128 188 104 256 104 Z" 
        fill="#1e293b" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>

  <!-- SOS / Defense Symbol: Emergency Padlock & Crosshair -->
  <!-- Padlock Shackle -->
  <path d="M216 230 V195 C216 173 234 155 256 155 C278 155 296 173 296 195 V230" 
        fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="196" y="224" width="120" height="96" rx="20" fill="#dc2626" stroke="#fecdd3" stroke-width="4"/>

  <!-- Keyhole -->
  <circle cx="256" cy="262" r="12" fill="#ffffff"/>
  <path d="M252 266 L248 290 H264 L260 266 Z" fill="#ffffff"/>

  <!-- 1930 Helpline Tag -->
  <rect x="176" y="336" width="160" height="34" rx="17" fill="#f59e0b"/>
  <text x="256" y="360" font-family="monospace, sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle" letter-spacing="2">SOS 1930</text>

  <!-- Pulse Alert Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.3"/>
</svg>
