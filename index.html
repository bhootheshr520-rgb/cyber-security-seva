    <script>
      // Suppress Vite HMR WebSocket closing errors in AI Studio iframe container
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a && a.message ? a.message : (a && a.stack ? a.stack : a)); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function (event) {
          var msg = event && (event.message || (event.error && event.error.message)) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && (event.reason && (event.reason.message || event.reason)) || '';
          if (String(reason).indexOf('WebSocket') !== -1 || String(reason).indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
